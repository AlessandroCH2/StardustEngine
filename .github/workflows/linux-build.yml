name: Linux build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # Ubuntu 22.04 keeps the required glibc old enough to run on most current distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compiler and libraries
        run: |
          # Network hiccups on the runner (DNS, Launchpad, mirrors) are retried instead of failing the build
          retry() { for attempt in 1 2 3 4 5; do "$@" && return 0; echo "Attempt $attempt failed: $*"; sleep $((attempt * 10)); done; return 1; }
          # GCC 13 comes from the toolchain PPA unless the runner image already has it
          if ! apt-cache policy g++-13 | grep -q 'Candidate: [0-9]'; then retry sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; fi
          retry sudo apt-get update
          retry sudo apt-get install -y g++-13 ninja-build libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libgl1-mesa-dev libasound2-dev libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      # Same SDK version as the Windows builds. Its DXC also runs on Ubuntu 22.04; 1.3.296 crashes on our compute shaders.
      - name: Vulkan SDK
        run: |
          mkdir -p "$RUNNER_TEMP/vulkansdk"
          curl --fail --location --retry 5 --retry-all-errors https://sdk.lunarg.com/sdk/download/1.4.363.1/linux/vulkansdk-linux-x86_64-1.4.363.1.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/vulkansdk" --strip-components=1
          sdk="$RUNNER_TEMP/vulkansdk/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$sdk/lib" "$sdk/bin/dxc" --version

      - name: Compile editor and player
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTARDUST_BUILD_EDITOR=ON \
            -DVulkan_dxc_EXECUTABLE="$VULKAN_SDK/bin/dxc" \
            -DVulkan_LIBRARY=/usr/lib/x86_64-linux-gnu/libvulkan.so -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build-linux --target StardustEditor StardustPlayer -j "$(nproc)" -- -k 0

      - name: Package
        run: |
          dist=dist/Stardust
          mkdir -p "$dist/Assets" "$dist/tools/dxc/bin" "$dist/tools/dxc/lib"
          cp -r build-linux/bin/Release/. "$dist/"
          cp -r Assets/Shaders "$dist/Assets/Shaders"
          cp -r Packages docs "$dist/"
          # The editor compiles custom shaders with its own copy of DXC
          cp -L "$VULKAN_SDK/bin/dxc" "$dist/tools/dxc/bin/dxc"
          cp -L "$VULKAN_SDK"/lib/libdxcompiler.so* "$dist/tools/dxc/lib/"
          printf '%s\n' '#!/bin/sh' 'here="$(cd -- "$(dirname -- "$0")" && pwd)"' \
            'LD_LIBRARY_PATH="$here/tools/dxc/lib:$LD_LIBRARY_PATH" exec "$here/StardustEditor" "$@"' > "$dist/Stardust.sh"
          chmod +x "$dist/Stardust.sh" "$dist/StardustEditor" "$dist/StardustPlayer" "$dist/tools/dxc/bin/dxc"
          # A tar keeps the executable permissions that a plain artifact upload would lose
          tar -czf Stardust-Linux-x64.tar.gz -C dist Stardust

      - uses: actions/upload-artifact@v4
        with:
          name: Stardust-Linux-x64
          path: Stardust-Linux-x64.tar.gz
          retention-days: 30
